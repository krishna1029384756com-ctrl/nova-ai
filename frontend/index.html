<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" id="homeScreen">

    <div class="logo">
        🤖
    </div>

    <h1>NOVA</h1>

    <p class="subtitle">
        Your Personal AI Assistant
    </p>

    <div class="buttons">

        <button id="chatBtn">
            Start Chat
        </button>

        <button id="settingsBtn">
            Settings
        </button>

    </div>

    <div class="wake-toggle-row">
        <label class="switch">
            <input type="checkbox" id="wakeWordToggle">
            <span class="slider"></span>
        </label>
        <span id="wakeWordLabel">Enable wake word</span>
    </div>

    <div class="status">

        Status :
        <span id="status">
            🟢 Online
        </span>

    </div>

</div>

<div class="chat-container hidden" id="chatScreen">

    <div class="chat-header">
        <span>🤖 NOVA</span>
        <span id="wakeIndicator" class="wake-indicator hidden">👂 Listening for "Hey NOVA"...</span>
        <button id="debugToggleBtn" class="icon-btn small-btn" title="Debug log">🐞</button>
        <button id="backBtn" class="icon-btn" title="Back">✕</button>
    </div>

    <div class="chat-log" id="chatLog"></div>

    <div class="debug-log hidden" id="debugLog"></div>

    <div class="chat-input-row">
        <button id="micBtn" class="icon-btn" title="Speak">🎤</button>
        <input type="text" id="chatInput" placeholder="Type or say something..." autocomplete="off">
        <button id="sendBtn" class="icon-btn send-btn" title="Send">➤</button>
    </div>

</div>

<div class="modal-overlay hidden" id="settingsModal">
    <div class="modal-box">
        <h3>Settings</h3>

        <label for="wakeWordInput">Wake word phrase</label>
        <input type="text" id="wakeWordInput" placeholder="e.g. Hey NOVA">
        <p class="modal-hint">Say this phrase to wake NOVA up hands-free.</p>

        <div class="modal-actions">
            <button id="closeSettingsBtn" class="secondary-btn">Cancel</button>
            <button id="saveSettingsBtn">Save</button>
        </div>
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
