name: NOVA AI Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing or new release tag (for example v0.3.0)"
        required: true
        default: "v0.3.0"

permissions:
  contents: write

env:
  MODEL_URL: "https://huggingface.co/ggml-org/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf?download=true"
  MODEL_SHA256: "d2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5"

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.release_tag }}"
          } else {
            $tag = "${env:GITHUB_REF_NAME}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use semantic versioning, for example v0.3.0"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          $version = $tag -replace '^v', ''
          "NOVA_VERSION=$version" >> $env:GITHUB_ENV

      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install NOVA dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build NOVA executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm installer/nova.spec

      - name: Download and verify NOVA model
        shell: pwsh
        run: |
          $modelDir = Join-Path (Resolve-Path dist\NOVA).Path "models"
          New-Item -ItemType Directory -Force -Path $modelDir | Out-Null
          $model = Join-Path $modelDir "Qwen3-1.7B-Q4_K_M.gguf"

          Write-Host "Downloading NOVA model..."
          curl.exe --location --fail --retry 12 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 3600 `
            -o "$model" "$env:MODEL_URL"

          if (-not (Test-Path $model)) {
            throw "Model download did not create the expected file."
          }

          $actual = (Get-FileHash $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:MODEL_SHA256.ToLowerInvariant()) {
            Remove-Item $model -Force
            throw "Model SHA-256 verification failed. Expected $env:MODEL_SHA256 but got $actual"
          }

          $sizeGB = [math]::Round((Get-Item $model).Length / 1GB, 2)
          Write-Host "Bundled verified NOVA model: $model ($sizeGB GB)"

      - name: Install WiX Toolset and UI extension
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0
          wix extension add --global WixToolset.UI.wixext/7.0.0
          wix --version

      - name: Prepare MSI source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          New-Item -ItemType Directory -Force -Path build\installer | Out-Null
          $source = (Resolve-Path dist\NOVA).Path
          $generated = Join-Path (Resolve-Path build\installer).Path "Generated-AppFiles.wxs"
          pwsh -File installer\Generate-AppFiles.ps1 -SourceDir $source -OutputFile $generated

      - name: Build MSI
        shell: pwsh
        run: |
          wix build `
            installer\NOVA.wxs `
            build\installer\Generated-AppFiles.wxs `
            -dVersion=$env:NOVA_VERSION `
            -dSourceDir=(Resolve-Path dist\NOVA).Path `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -o "artifacts\NOVA-AI-$env:NOVA_VERSION-x64.msi"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\NOVA\* -DestinationPath "artifacts\NOVA-AI-$env:NOVA_VERSION-Portable.zip" -Force

      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } |
            Set-Content artifacts\checksums.txt -Encoding ascii

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $msi = "artifacts\NOVA-AI-$env:NOVA_VERSION-x64.msi"
          $zip = "artifacts\NOVA-AI-$env:NOVA_VERSION-Portable.zip"
          $checksums = "artifacts\checksums.txt"

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "NOVA AI $tag" --generate-notes
          }

          gh release upload $tag $msi $zip $checksums --clobber
